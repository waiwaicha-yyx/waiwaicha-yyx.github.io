<!DOCTYPE html>
<!--
素材替换指南：
- config.js：集中编辑英文履历、图片/视频地址和项目链接。
- assets/poses/：六个透明人物视角；scene.poses：镜筒前后端坐标。换图需重新标定。
- intro.mode=unified-alpha：v3 人物透明帧叠在同一海景上；卷轴与介绍页复用同一配置和 CSS。
- scene.atmosphere：控制动态星点开关和桌面/手机数量；Reduce motion 可关闭所有动效。
- 公开版不包含论文原文、简历或研究计划文件，下载链接保持空值。
- 原生 HTML/CSS/JS，无需构建。可运行 python3 -m http.server 8772 本地预览。
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102e39">
  <meta name="description" content="">
  <title>Yixin Yuan</title>
  <link rel="stylesheet" href="styles.css?v=20261126-awards-v11">
  <script src="config.js?v=20261126-awards-v11" defer></script>
  <script src="app.js?v=20261126-awards-v11" defer></script>
</head>
<body>
  <section id="intro" class="intro intro-six" aria-labelledby="intro-title">
    <div id="intro-layout" class="stage six-scrolls intro-layout ocean-scene">
      <div id="intro-film" class="intro-film"><video id="intro-video" class="intro-video" playsinline muted preload="auto" hidden></video></div>
      <div class="intro-ambient" aria-hidden="true"></div><div class="intro-light-layer" aria-hidden="true"><div class="ocean-light ocean-light-a"></div><div class="ocean-light ocean-light-b"></div></div>
      <div class="scene-signature"><span id="intro-display-name" class="intro-display-name"></span><p id="intro-display-motto"></p></div>
      <canvas id="intro-alpha" class="intro-alpha" aria-hidden="true"></canvas><img id="intro-character" class="intro-character" alt="" aria-hidden="true">
      <div class="wave-layer" aria-hidden="true"><svg class="wave wave-far" viewBox="0 0 1600 110" preserveAspectRatio="none"><path d="M0 45 Q80 2 160 42 T320 45 T480 40 T640 48 T800 40 T960 45 T1120 42 T1280 46 T1440 40 T1600 45 V110 H0Z"/></svg><svg class="wave wave-near" viewBox="0 0 1600 110" preserveAspectRatio="none"><path d="M0 50 Q70 12 140 48 T280 46 T420 51 T560 46 T700 50 T840 45 T980 48 T1120 44 T1260 50 T1400 47 T1540 50 L1600 45 V110 H0Z"/></svg></div><nav id="intro-scrolls" class="scroll-nav" aria-label="Explore portfolio chapters"></nav>
    </div>
    <img id="intro-poster" class="intro-poster" alt="" fetchpriority="high">
    
    <div class="intro-shade"></div>
    <div class="intro-top"><span id="intro-name"></span><button id="skip-intro" class="text-button"></button></div>
    <div class="intro-copy">
      <p id="intro-kicker" class="eyebrow"></p>
      <h1 id="intro-title"></h1>
      <p id="intro-description"></p>
      <button id="enter" class="primary-button"><span></span><span aria-hidden="true">↗</span></button>
    </div>
    <div class="video-controls"><button id="play-video" class="text-button" hidden></button><button id="sound" class="text-button" hidden></button></div>
    <span class="intro-compass" aria-hidden="true">✧</span>
  </section>

  <main id="main" class="main" inert>
    <header class="topbar">
      <a id="brand" class="brand" href="#about"></a>
      <span id="subtitle" class="top-subtitle"></span>
      <div class="top-actions"><button id="motion" class="icon-button"></button><button id="replay" class="text-button"></button></div>
    </header>
    <section id="voyage" class="voyage" aria-labelledby="scene-title">
      <h1 id="scene-title" class="sr-only"></h1>
      <div id="stage" class="stage six-scrolls ocean-scene layered-scene">
        <img id="mobile-character" class="mobile-character" alt="" aria-hidden="true"><div id="scene-images" class="scene-images" aria-hidden="true"></div><div id="telescope-beam" class="telescope-beam" aria-hidden="true"></div><div id="lens-glow" class="lens-glow" aria-hidden="true"></div>
        <div id="atmosphere" class="atmosphere" aria-hidden="true"><div class="ocean-light ocean-light-a"></div><div class="ocean-light ocean-light-b"></div><canvas id="stardust"></canvas></div>
        <div class="sea-vignette" aria-hidden="true"></div>
        <div class="scene-signature"><span id="scene-name-mobile"></span><p id="motto"></p></div>
        <div class="wave-layer" aria-hidden="true"><svg class="wave wave-far" viewBox="0 0 1600 110" preserveAspectRatio="none"><path d="M0 45 Q80 2 160 42 T320 45 T480 40 T640 48 T800 40 T960 45 T1120 42 T1280 46 T1440 40 T1600 45 V110 H0Z"/></svg><svg class="wave wave-near" viewBox="0 0 1600 110" preserveAspectRatio="none"><path d="M0 50 Q70 12 140 48 T280 46 T420 51 T560 46 T700 50 T840 45 T980 48 T1120 44 T1260 50 T1400 47 T1540 50 L1600 45 V110 H0Z"/></svg></div><nav id="scroll-nav" class="scroll-nav"></nav>
        <div class="scene-caption"><span class="tiny-star" aria-hidden="true">✧</span><p id="scene-hint"></p></div>
      </div>
      <div class="voyage-bottom"><span id="education"></span><button id="awards" class="award-button"><span aria-hidden="true">✦</span><span></span><span aria-hidden="true">↗</span></button></div>
    </section>
    <section id="about" class="about">
      <div><p id="about-kicker" class="eyebrow"></p><h2 id="headline"></h2></div>
      <div class="about-content"><p id="bio"></p><p id="education-previous" class="education-previous"></p><p id="skills-label" class="eyebrow"></p><ul id="skills" class="skills"></ul><div class="about-links"><a id="contact" class="primary-button"></a><a id="cv" class="text-link"></a><a id="github-profile" class="text-link" hidden></a><a id="research-plan" class="text-link"></a><button id="beyond" class="more-button"></button></div></div>
    </section>
    <footer><span id="footer-text"></span><span id="footer-name"></span></footer>
  </main>

  <dialog id="detail" class="detail" aria-labelledby="detail-title">
    <div class="paper">
      <div class="paper-top"><span id="detail-number" class="eyebrow"></span><button id="close-detail" class="close-button"><span aria-hidden="true">×</span></button></div>
      <header class="paper-heading"><p id="detail-subtitle" class="eyebrow"></p><h2 id="detail-title" tabindex="-1"></h2><p id="detail-intro"></p></header>
      <div id="detail-projects"></div>
      <div class="paper-end" aria-hidden="true">✧</div>
    </div>
  </dialog>
  <noscript><div class="noscript">Please enable JavaScript to explore this portfolio.</div></noscript>
</body>
</html>
